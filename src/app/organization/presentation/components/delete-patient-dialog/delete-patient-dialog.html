<h2 mat-dialog-title>{{ 'patient.deletePatientDialog.title' | translate }}</h2>
<mat-dialog-content>
  <p>{{ 'patient.deletePatientDialog.message' | translate }}</p>
  <p><strong>{{ data.patient.fullName }}</strong></p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">
    {{ 'patient.deletePatientDialog.cancel' | translate }}
  </button>
  <button mat-raised-button color="warn" (click)="onConfirm()">
    {{ 'patient.deletePatientDialog.confirm' | translate }}
  </button>
</mat-dialog-actions>
