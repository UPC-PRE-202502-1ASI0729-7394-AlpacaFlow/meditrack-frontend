<div class="keeper-card"
     (click)="onCardClick()"
     (dblclick)="onCardDoubleClick()"
     [title]="'keeper.clickToView' | translate">

    <div class="keeper-avatar">
        <img [src]="keeper.imageUrl || '/assets/default-keeper.png'"
             [alt]="keeper.fullName"
             class="avatar-image">
    </div>

    <div class="keeper-info">
        <div class="keeper-name"> {{ keeper.fullName }}</div>
    </div>

    <div class="keeper-actions">
        <button class="action-btn edit-btn"
                (click)="onEdit($event)"
                [title]="'keeper.edit' | translate">
            <mat-icon>edit</mat-icon>
        </button>
        <button class="action-btn delete-btn"
                (click)="onRemove($event)"
                [title]="'keeper.delete' | translate">
            <mat-icon>delete</mat-icon>
        </button>
    </div>
</div>
